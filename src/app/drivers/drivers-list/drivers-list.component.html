<header>
  <h1 class="title">Drivers</h1>
  <button class="register-driver-btn" routerLink="register-driver">
    + Register New Driver
  </button>
</header>

<div class="drivers-table-wrapper">
  <table class="drivers-table">
    <thead>
      <tr>
        <th>Driver</th>
        <th>License Number</th>
        <th>Phone</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @if (isLoading()) {
        <tr>
          <td colspan="5" class="spinner-cell">
            <div class="spinner-container">
              <span class="spinning-loader"></span>
              <p class="loading-text">Fetching drivers...</p>
            </div>
          </td>
        </tr>
      } @else {
        @for (driver of drivers(); track driver.driverId) {
          <tr>
            <td class="table-driver">
              <div class="table-driver-icon-wrapper">
                <mat-icon>person</mat-icon>
              </div>
              <div>
                <p class="driver-name">{{ driver.name }}</p>
                <p class="driver-id">ID: {{ driver.driverId }}</p>
              </div>
            </td>
            <td>{{ driver.licenseNumber }}</td>
            <td>{{ driver.phone }}</td>

            <td>
              <span class="status-badge" [class.status-badge--active]="true">
                Active
              </span>
            </td>
            <td class="actions-cell">
              <button class="btn-icon">
                <mat-icon>more_vert</mat-icon>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="no-drivers">
              <p>No Drivers Registered</p>
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>

<div class="cropper-modal-backdrop">
  <div class="cropper-modal-container">
    
    <div class="cropper-modal-header">
      <h3>Adjust Photo</h3>
      <button (click)="cancel.emit()" class="close-btn">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="cropper-modal-body">
      @if (errorMessage()) {
        <div class="error-alert">
          {{ errorMessage() }}
        </div>
      }

      <div class="cropper-wrapper">
        <image-cropper
          [imageFile]="imageFile()"
          [maintainAspectRatio]="true"
          [containWithinAspectRatio]="false"
          [aspectRatio]="1 / 1"
          [resizeToWidth]="256"
          [onlyScaleDown]="true"
          [roundCropper]="true"
          [transform]="{ scale: zoom(), translateUnit: 'px' }"
          format="png"
          (imageCropped)="imageCropped($event)"
          (imageLoaded)="imageLoaded($event)"
          (cropperReady)="cropperReady()"
          (loadImageFailed)="loadImageFailed()"
        />
      </div>

      <div class="zoom-controls-wrapper">
        <label>Zoom</label>
        <div class="zoom-slider-container">
          <mat-icon>zoom_out</mat-icon>
          <input
            type="range"
            min="1"
            max="3"
            step="0.1"
            [value]="zoom()"
            (input)="onZoomChange($event)"
          />
          <mat-icon>zoom_in</mat-icon>
        </div>
      </div>
    </div>

    <div class="cropper-modal-footer">
      <button (click)="cancel.emit()" class="btn btn-outline">
        Cancel
      </button>
      <button (click)="onSave()" class="btn btn-warning-flat" style="background-color: #2563eb; color: #ffffff;">
        Save Photo
      </button>
    </div>

  </div>
</div>

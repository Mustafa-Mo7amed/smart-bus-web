<!-- Brand Area -->
<div class="brand-area">
  <div class="brand-logo-wrap">
    <img src="wasla-logo-rounded.png" alt="Wasla logo" class="brand-logo" />
  </div>
  <div class="brand-text">
    <h1>Wasla</h1>
    <span class="brand-tagline">Transit Manager</span>
  </div>
</div>

<div class="brand-divider"></div>

<p class="nav-section-label">Main Menu</p>

<!-- Navigation Links -->
<ul class="nav-links">
  <li class="nav-link-item" routerLink="overview" routerLinkActive="active" id="nav-overview">
    <mat-icon>widgets</mat-icon>
    <span>Overview</span>
  </li>
  <li class="nav-link-item" routerLink="routes" routerLinkActive="active" id="nav-routes">
    <mat-icon>route</mat-icon>
    <span>Routes</span>
  </li>
  <li class="nav-link-item" routerLink="drivers" routerLinkActive="active" id="nav-drivers">
    <mat-icon>group</mat-icon>
    <span>Drivers</span>
  </li>
  <li class="nav-link-item" routerLink="buses" routerLinkActive="active" id="nav-buses">
    <mat-icon>directions_bus</mat-icon>
    <span>Buses</span>
  </li>
  <li class="nav-link-item" routerLink="assignments" routerLinkActive="active" id="nav-assignments">
    <mat-icon>assignment</mat-icon>
    <span>Assignments</span>
  </li>
  <li class="nav-link-item" routerLink="reports" routerLinkActive="active" id="nav-reports">
    <mat-icon>report</mat-icon>
    <span>Reports</span>
  </li>
</ul>

<!-- Bottom Section -->
<div class="nav-bottom">
  <div class="nav-link-item nav-logout" (click)="onLogout()" id="nav-logout">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </div>
</div>

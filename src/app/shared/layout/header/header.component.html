<!-- The :host element IS the header bar — no extra wrapper needed -->
<div class="header-left">
  <h2 class="page-title">{{ pageTitle }}</h2>
</div>

<div class="header-right">
  <!-- Support Link -->
  <a href="mailto:mostaamoahmedd985@gmail.com" class="support-link" id="header-support">
    <mat-icon>help_outline</mat-icon>
    <span>Support</span>
  </a>

  <!-- Divider -->
  <div class="header-divider"></div>

  <!-- Manager Profile -->
  <div class="manager-profile" id="header-profile">
    <div class="profile-info">
      <p class="manager-name">Station Manager</p>
      <p class="station-name">Minya Station</p>
    </div>
    <div class="profile-avatar">
      <img src="wasla-logo-rounded.png" alt="Manager profile" />
    </div>
  </div>
</div>
